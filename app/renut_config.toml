# pacman-nx (PAC-MAN Championship Edition DX+, title 58410A8C, title update 3 v0.0.3.2, XDK 2.0.21250) - ReXGlue codegen configuration.
# The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so banjo-nx's CMake, post-codegen passes and renderer glue work unchanged; the NRO and the SD
# folder are pacman-nx (docs/pacman-notes.md, "Decisions").

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true


# The register "diet" keys (every codegen option banjo-nx uses), audited for this game (docs/pacman-notes.md, "Codegen options"):
#   - non_volatile_as_local (r14-r31, f14-f31, v14-v31 / v64-v127 as C++ locals, no __savegprlr / __restgprlr traffic):
#     tools/read_before_write.py --noreturn=823F85C0,8219F2C0 on code generated WITH the option; split pieces get
#     share_registers (config/renut_funcs.toml).
#   - elide_lr_stores: the link register is read by prologue saves and setjmp / longjmp only (handled at their call sites).
#   - non_argument_as_local (r0, r2, r11, r12, f0, v32-v63 as C++ locals): tools/non_argument_audit.py; ENTRY and RET
#     functions below keep them in ctx, their callers hand them over.
non_volatile_as_local = true
# v64-v127 stay in ctx in every function (katamari-nx's finding, rc3: the XDK's video decoder keeps constants in VMX128
# registers across its calls; only functions that name a register above v31 pay for it).
non_volatile_as_local_keep = ["v64-v127"]
elide_lr_stores = true
non_argument_as_local = true
# 74 ENTRY and 2 RET functions (tools/diet_keep_list.py, from tools/non_argument_audit.py).
non_argument_as_local_keep = [
    0x8214E060, 0x8214E088, 0x8214E354, 0x8214E37C, 0x8214EC18, 0x8214EC38, 0x8214F26C, 0x8214F310,
    0x8214F54C, 0x8214F574, 0x8214F6A4, 0x8221088C, 0x822108AC, 0x82211188, 0x82214454, 0x82214AE8,
    0x82214B08, 0x82216940, 0x82216960, 0x822182C0, 0x8221F718, 0x8221F738, 0x8221FC3C, 0x8221FC5C,
    0x82220174, 0x82220A3C, 0x82220A5C, 0x82220DE8, 0x82220E14, 0x82220F1C, 0x82220F3C, 0x82223050,
    0x82223118, 0x82223D70, 0x82223D90, 0x82223F14, 0x82223F34, 0x82224090, 0x822240B0, 0x822242D8,
    0x822242F8, 0x82224A18, 0x82224B84, 0x82224E84, 0x82225038, 0x822252C4, 0x82225638, 0x8247186C,
    0x8247188C, 0x82471A80, 0x82471AA0, 0x82471C20, 0x82471F54, 0x82471F74, 0x8247219C, 0x824721BC,
    0x82473A64, 0x82473A84, 0x82473C3C, 0x82473C5C, 0x82474004, 0x82474024, 0x824748A4, 0x824748C4,
    0x82474B2C, 0x82474B4C, 0x824750F8, 0x82475124, 0x8247581C, 0x8247583C, 0x824A0600, 0x824A0AE8,
    0x824A22B0, 0x824A2700, 0x824A2A70, 0x824A2E78,
]

# setjmp / longjmp by shape (peggle2-nx's method; tools/ppc_dis.py), in title update 3: setjmp 0x82472CA0 (`stfd f14,0(r3)` at
# 0x82472CBC: the only one in the image), longjmp 0x82472980 (`lfd f14,0(r7)` at 0x824729BC: the only one).
setjmp_address = 0x82472CA0
longjmp_address = 0x82472980

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

